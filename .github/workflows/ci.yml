name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # main's branch protection requires this job by name: rename both together.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Builds dist/ first (pretest): the entry tests load what ships.
      - run: npm test
